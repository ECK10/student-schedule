<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>학생 일정 관리</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#17324d;--red:#ed5b5d;--bg:#f5f7fb;--line:#dce5ed;--muted:#6b7b8d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#26384a;font-family:"Malgun Gothic",sans-serif}header{background:var(--navy);color:#fff;padding:28px 18px}main{max-width:720px;margin:auto;padding:16px}h1{margin:0;font-size:24px}header p{margin:7px 0 0;color:#bad0e0;font-size:13px}.panel,.item{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}.panel h2{margin:0 0 14px;color:var(--navy);font-size:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:block;color:var(--muted);font-size:12px;font-weight:bold;margin-bottom:5px}input,textarea{width:100%;margin-top:5px;padding:11px;border:1px solid #cbd7e2;border-radius:6px;font:inherit}textarea{min-height:70px;resize:vertical}.actions{display:flex;gap:8px;margin-top:12px}button{border:0;border-radius:6px;padding:11px 14px;background:#e9eff5;color:var(--navy);font-weight:bold;cursor:pointer}button.primary{flex:1;background:var(--red);color:#fff}.item{border-left:5px solid #9aafc0}.item.urgent{border-left-color:var(--red);background:#fff0f0}.item.today{border-left-color:#d6a400;background:#fff9df}.top{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.dday{color:var(--red);font-weight:bold}.tag{display:inline-block;margin-top:9px;padding:4px 8px;background:#e7f0f7;border-radius:4px;font-size:12px;font-weight:bold}.title{font-weight:bold}.memo{color:var(--muted);font-size:13px;white-space:pre-wrap}.empty{text-align:center;color:var(--muted)}.hidden{display:none}.account{display:flex;justify-content:space-between;align-items:center;gap:10px}.account span{font-size:13px;color:#d7e6f0}@media(max-width:480px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body><header><div class="account"><div><h1>학생 일정 관리</h1><p>수행평가, 시험, 학교 행사를 안전하게 관리하세요</p></div><button id="logout" class="hidden" onclick="logout()">로그아웃</button></div></header>
<main><section id="auth" class="panel"><h2 id="auth-title">로그인</h2><label>이메일<input id="email" type="email" autocomplete="email"></label><label>비밀번호<input id="password" type="password" autocomplete="current-password"></label><div class="actions"><button class="primary" onclick="login()">로그인</button><button onclick="signup()">회원가입</button></div><p id="auth-message" class="memo"></p></section>
<section id="app" class="hidden"><section class="panel"><h2 id="form-title">일정 등록</h2><div class="grid"><div><label>날짜<input id="schedule-date" type="date"></label></div><div><label>과목 / 시험 / 행사<input id="category" placeholder="예: 중간고사, 수학"></label></div><div class="full"><label>일정 내용<input id="title" placeholder="예: 수학 시험"></label></div><div class="full"><label>메모<textarea id="memo"></textarea></label></div></div><div class="actions"><button class="primary" id="save" onclick="saveSchedule()">일정 등록</button><button onclick="clearForm()">초기화</button></div></section><section class="panel"><label>날짜별 조회<input id="filter-date" type="date" onchange="loadSchedules()"></label><button onclick="showAll()">전체 보기</button></section><section id="list"></section></section></main>
<script>
const SUPABASE_URL='https://euldcwhbhpzlausynxwq.supabase.co';const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1bGRjd2hiaHB6bGF1c3lueHdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MjIwNDUsImV4cCI6MjEwMzI5ODA0NX0.dtgUHTEJ6GZ-MfsBj4enA5e_FhGwJ-dbP0QhtILM6d0';const client=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let editing=null;const today=new Date().toISOString().slice(0,10);document.querySelector('#schedule-date').value=today;
function configured(){return !SUPABASE_URL.startsWith('YOUR_')&&!SUPABASE_ANON_KEY.startsWith('YOUR_')}function message(text){document.querySelector('#auth-message').textContent=text}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function login(){if(!configured()){message('Supabase 설정값을 먼저 입력하세요.');return}const{error}=await client.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)message(error.message)}async function signup(){if(!configured()){message('Supabase 설정값을 먼저 입력하세요.');return}const{error}=await client.auth.signUp({email:email.value.trim(),password:password.value});message(error?error.message:'회원가입이 완료되었습니다. 이메일 인증 후 로그인하세요.')}async function logout(){await client.auth.signOut()}
async function loadSchedules(){const{data,error}=await client.from('schedules').select('*').order('schedule_date',{ascending:true}).order('id',{ascending:true});if(error){alert(error.message);return}const filter=document.querySelector('#filter-date').value;const rows=(data||[]).filter(x=>!filter||x.schedule_date===filter);const list=document.querySelector('#list');if(!rows.length){list.innerHTML='<div class="panel empty">등록된 일정이 없습니다.</div>';return}list.innerHTML=rows.map(x=>{const left=Math.round((new Date(x.schedule_date)-new Date(today))/86400000);const cls=left===0?'today':left>0&&left<=3?'urgent':'';const d=left===0?'D-Day':left>0?'D-'+left:'D+'+Math.abs(left);return `<article class="item ${cls}"><div class="top"><span>${esc(x.schedule_date)}</span><span class="dday">${d}</span></div><span class="tag">${esc(x.subject)}</span><p class="title">${esc(x.title)}</p><p class="memo">${esc(x.memo)}</p><button onclick='editSchedule(${JSON.stringify(x)})'>수정</button> <button onclick="deleteSchedule(${x.id})">삭제</button></article>`}).join('')}
async function saveSchedule(){const user=(await client.auth.getUser()).data.user;const row={schedule_date:document.querySelector('#schedule-date').value,subject:category.value.trim(),title:title.value.trim(),memo:memo.value.trim(),user_id:user.id};if(!row.schedule_date||!row.subject||!row.title){alert('날짜, 분류, 일정 내용을 입력하세요.');return}let result=editing?await client.from('schedules').update(row).eq('id',editing):await client.from('schedules').insert(row);if(result.error){alert(result.error.message);return}clearForm();loadSchedules()}
function editSchedule(x){editing=x.id;document.querySelector('#form-title').textContent='일정 수정';document.querySelector('#save').textContent='수정 저장';document.querySelector('#schedule-date').value=x.schedule_date;category.value=x.subject;title.value=x.title;memo.value=x.memo;scrollTo(0,0)}async function deleteSchedule(id){if(confirm('선택한 일정을 삭제할까요?')){const{error}=await client.from('schedules').delete().eq('id',id);if(error)alert(error.message);else loadSchedules()}}function clearForm(){editing=null;document.querySelector('#form-title').textContent='일정 등록';document.querySelector('#save').textContent='일정 등록';document.querySelector('#schedule-date').value=today;category.value='';title.value='';memo.value=''}function showAll(){document.querySelector('#filter-date').value='';loadSchedules()}
client.auth.onAuthStateChange((_event,session)=>{const logged=!!session;document.querySelector('#auth').classList.toggle('hidden',logged);document.querySelector('#app').classList.toggle('hidden',!logged);document.querySelector('#logout').classList.toggle('hidden',!logged);if(logged)loadSchedules()});
</script></body></html>
